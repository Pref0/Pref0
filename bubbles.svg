<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <radialGradient id="glass" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mini" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <style>
    .f { animation: float 7s ease-in-out infinite alternate; }
    .f2 { animation-duration: 8.5s; animation-delay: -2s; }
    .f3 { animation-duration: 6s;   animation-delay: -4s; }
    .f4 { animation-duration: 9s;   animation-delay: -1s; }
    @keyframes float {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(6px, -10px); }
      100% { transform: translate(-5px, 8px); }
    }
    .r { animation: rise 9s linear infinite; opacity: 0; }
    @keyframes rise {
      0%   { transform: translateY(0);      opacity: 0; }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.6; }
      100% { transform: translateY(-360px); opacity: 0; }
    }
    .ring { fill: url(#glass); stroke: #c4b5fd; stroke-opacity: 0.65; stroke-width: 1.5; }
    .shine { fill: #ffffff; opacity: 0.4; }
    .halo { fill: url(#glow); }
    text {
      fill: #f5f3ff;
      font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <g fill="url(#mini)">
    <circle class="r" cx="60"  cy="340" r="5" style="animation-delay:0s"/>
    <circle class="r" cx="190" cy="340" r="3" style="animation-delay:-3s;animation-duration:11s"/>
    <circle class="r" cx="330" cy="340" r="6" style="animation-delay:-6s"/>
    <circle class="r" cx="470" cy="340" r="4" style="animation-delay:-1.5s;animation-duration:12s"/>
    <circle class="r" cx="640" cy="340" r="5" style="animation-delay:-4.5s"/>
    <circle class="r" cx="770" cy="340" r="3" style="animation-delay:-7s;animation-duration:10s"/>
    <circle class="r" cx="880" cy="340" r="4" style="animation-delay:-2.5s"/>
  </g>

  <g transform="translate(120 150)"><g class="f">
    <circle class="halo" r="80"/><circle class="ring" r="62"/>
    <ellipse class="shine" cx="-22" cy="-28" rx="20" ry="9" transform="rotate(-30 -22 -28)"/>
    <text font-size="15">TypeScript</text>
  </g></g>

  <g transform="translate(270 88)"><g class="f f2">
    <circle class="halo" r="66"/><circle class="ring" r="50"/>
    <ellipse class="shine" cx="-18" cy="-22" rx="16" ry="7" transform="rotate(-30 -18 -22)"/>
    <text font-size="15">React</text>
  </g></g>

  <g transform="translate(255 238)"><g class="f f3">
    <circle class="halo" r="68"/><circle class="ring" r="52"/>
    <ellipse class="shine" cx="-18" cy="-23" rx="17" ry="7" transform="rotate(-30 -18 -23)"/>
    <text font-size="15">Next.js</text>
  </g></g>

  <g transform="translate(405 168)"><g class="f f4">
    <circle class="halo" r="64"/><circle class="ring" r="48"/>
    <ellipse class="shine" cx="-17" cy="-21" rx="15" ry="7" transform="rotate(-30 -17 -21)"/>
    <text font-size="14">Node.js</text>
  </g></g>

  <g transform="translate(525 92)"><g class="f f3">
    <circle class="halo" r="54"/><circle class="ring" r="40"/>
    <ellipse class="shine" cx="-14" cy="-17" rx="12" ry="6" transform="rotate(-30 -14 -17)"/>
    <text font-size="14">Lua</text>
  </g></g>

  <g transform="translate(565 230)"><g class="f f2">
    <circle class="halo" r="74"/><circle class="ring" r="58"/>
    <ellipse class="shine" cx="-20" cy="-26" rx="19" ry="8" transform="rotate(-30 -20 -26)"/>
    <text font-size="15">UI / UX</text>
  </g></g>

  <g transform="translate(712 128)"><g class="f">
    <circle class="halo" r="80"/><circle class="ring" r="62"/>
    <ellipse class="shine" cx="-22" cy="-28" rx="20" ry="9" transform="rotate(-30 -22 -28)"/>
    <text font-size="14">Discord bots</text>
  </g></g>

  <g transform="translate(832 238)"><g class="f f4">
    <circle class="halo" r="56"/><circle class="ring" r="42"/>
    <ellipse class="shine" cx="-15" cy="-18" rx="13" ry="6" transform="rotate(-30 -15 -18)"/>
    <text font-size="14">Web</text>
  </g></g>
</svg>
